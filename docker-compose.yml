services:

  # BD
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    
    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval:  10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # API
  api:
    build:
      context: .
      dockerfile: src/PortfolioHub.Api/Dockerfile

    depends_on:
      db:
        condition: service_healthy #só sobe quando o banco estiver pronto

    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=PortfolioHub;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Database__ApplyMigrations: "true"
      Brapi__Token: ${BRAPI_TOKEN:-}
      Cors__AllowedOrigins__0: http://localhost:5287
    
    ports:
      - "5146:8080"


  #WEB
  web:
    build:
      context: .
      dockerfile: src/PortfolioHub.Web/Dockerfile
    
    depends_on:
      - api

    ports:
      - "5287:8080"

volumes:
  sqlserver-data: